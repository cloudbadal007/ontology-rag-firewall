[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-rag-firewall"
version = "0.1.0"
description = "Ontology-gated extraction firewall for enterprise documents."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pankaj Kumar" }]
dependencies = [
  "anthropic>=0.25.0",
  "rdflib>=6.3.0",
  "pyshacl>=0.25.0",
  "sentence-transformers>=2.7.0",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
